<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Origin CAD ist umgezogen</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#16191d;color:#e4e7eb;font:16px/1.5 system-ui,sans-serif;padding:24px;box-sizing:border-box}main{max-width:460px}a{color:#ff8a70}h1{font-size:22px;margin:0 0 8px}</style>
</head>
<body>
<main>
<h1>Origin CAD ist umgezogen</h1>
<p>Das Zeichenprogramm hat jetzt eine eigene Adresse:<br><a href="https://noahfa.github.io/origin-cad/">noahfa.github.io/origin-cad</a></p>
<p id="info">Deine zuletzt bearbeitete Zeichnung ist dort weiter vorhanden.</p>
</main>
<script>
// alten Offline-Speicher dieser Adresse aufräumen, dann weiterleiten, sobald die neue Adresse erreichbar ist
(async()=>{try{if('serviceWorker' in navigator)for(const r of await navigator.serviceWorker.getRegistrations())if(new URL(r.scope).pathname.endsWith('/cad/'))await r.unregister();
 if(window.caches)for(const k of await caches.keys())if(k.startsWith('origincad-'))await caches.delete(k)}catch(e){}
 try{const r=await fetch('/origin-cad/',{method:'HEAD',cache:'no-store'});if(r.ok)location.replace('/origin-cad/');else document.getElementById('info').textContent='Die neue Adresse ist noch nicht eingeschaltet (GitHub › origin-cad › Settings › Pages).'}catch(e){}})();
</script>
</body>
</html>
